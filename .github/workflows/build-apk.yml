name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Sync Capacitor Android Project
        env:
          CAPACITOR_TELEMETRY: "false"
        run: |
          echo "Ensuring Capacitor dependencies are present..."
          npm install --no-audit --no-fund @capacitor/core@8.5.1 @capacitor/cli@8.5.1 @capacitor/android@8.5.1 --legacy-peer-deps

          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            echo "Android directory missing or incomplete. Adding Android platform..."
            rm -rf android
            npx --yes @capacitor/cli add android
          fi

          echo "Syncing Android project..."
          npx --yes @capacitor/cli sync android

      - name: Make Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/OmniCraft-3D-Studio-debug.apk
            echo "APK_FILE=build-artifacts/OmniCraft-3D-Studio-debug.apk" >> $GITHUB_ENV
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/OmniCraft-3D-Studio-release.apk
            echo "APK_FILE=build-artifacts/OmniCraft-3D-Studio-release.apk" >> $GITHUB_ENV
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniCraft-3D-Studio-APK
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Add Job Summary
        run: |
          echo "## 🎮 Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your **OmniCraft 3D Game Studio** APK is ready for your phone." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 How to Install on Your Phone:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Summary** tab of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "2. Under **Artifacts**, download \`OmniCraft-3D-Studio-APK\`." >> $GITHUB_STEP_SUMMARY
          echo "3. On your phone, tap the downloaded APK to install." >> $GITHUB_STEP_SUMMARY