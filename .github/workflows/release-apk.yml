name: Publish Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        env:
          CAPACITOR_TELEMETRY: "false"
        run: |
          if [ ! -f "android/build.gradle" ] || [ ! -f "android/app/build.gradle" ]; then
            echo "Android directory is missing or incomplete. Initializing clean Android platform..."
            rm -rf android
            npx --yes @capacitor/cli add android
          fi

          if ! npx --yes @capacitor/cli sync android; then
            echo "Capacitor sync encountered an error. Recreating Android platform from scratch..."
            rm -rf android
            npx --yes @capacitor/cli add android
            npx --yes @capacitor/cli sync android
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/OmniCraft-3D-Studio-${{ github.event.inputs.tag_name || github.ref_name }}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "OmniCraft 3D Studio ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            ### 🎮 OmniCraft 3D Game Studio Mobile APK
            
            Install directly on your Android phone:
            1. Download the `.apk` file below directly on your mobile phone browser.
            2. Open the downloaded file from notifications or Files app.
            3. Tap **Install** (allow *Install unknown apps* if prompted).
            4. Enjoy 3D game creating and playing on the go!
          files: release-assets/*.apk
