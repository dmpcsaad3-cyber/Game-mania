<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Isometric 3D Platform Grid Core -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Top Face of 3D Cube -->
    <polygon points="0,-100 90,-48 0,4 -90,-48" fill="url(#primary)" opacity="0.9" />
    
    <!-- Left Face -->
    <polygon points="-90,-48 0,4 0,110 -90,56" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Right Face -->
    <polygon points="0,4 90,-48 90,56 0,110" fill="#0f172a" stroke="#6366f1" stroke-width="2" />

    <!-- Play/Controller Accent -->
    <circle cx="0" cy="-48" r="28" fill="#ffffff" opacity="0.95" />
    <polygon points="-8,-60 14,-48 -8,-36" fill="#0284c7" />

    <!-- Isometric Glowing Pillars -->
    <circle cx="-50" cy="15" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="50" cy="15" r="8" fill="#a855f7" filter="url(#glow)" />
    <circle cx="0" cy="65" r="8" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Mobile Studio Badge -->
  <text x="256" y="440" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="4">OMNICRAFT 3D</text>
</svg>
